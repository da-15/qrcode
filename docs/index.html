<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QRリーダー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root { --bg:#111827; --fg:#f9fafb; --accent:#22c55e; --muted:#9ca3af; --card:#1f2937; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; background:var(--bg); color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
    body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    header { padding:14px 16px; font-weight:700; font-size:18px; }
    .icon-btn { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%;
      background:var(--card); color:var(--fg); border:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .icon-btn svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .icon-btn:active { transform:scale(.92); }
    .icon-btn[aria-pressed="true"] { background:#facc15; color:#111827; }
    .icon-btn.unavailable { opacity:.35; }
    #stage { position:relative; flex:1; overflow:hidden; background:#000; }
    video { width:100%; height:100%; object-fit:cover; }
    #frame { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
    #frame div { width:min(65vw,280px); aspect-ratio:1; border:3px solid var(--accent); border-radius:16px;
      box-shadow:0 0 0 9999px rgba(0,0,0,.45); }
    #msg { position:absolute; bottom:16px; left:0; right:0; text-align:center; color:var(--muted); font-size:14px; }
    #controls { display:flex; justify-content:space-evenly; align-items:center; padding:14px 16px; }
    #controls .icon-btn { width:56px; height:56px; }
    #controls .icon-btn svg { width:26px; height:26px; }
    #file { display:none; }
    #result { display:none; position:fixed; inset:auto 0 0 0; background:var(--card); border-radius:16px 16px 0 0;
      padding:20px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -8px 24px rgba(0,0,0,.4); }
    #result.show { display:block; }
    #result p.label { color:var(--muted); font-size:12px; margin-bottom:6px; padding-right:44px; }
    #result .close-x { position:absolute; top:10px; right:10px; width:36px; height:36px; border-radius:50%; border:none;
      background:#374151; color:var(--fg); display:flex; align-items:center; justify-content:center; cursor:pointer; }
    #result .close-x svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; }
    #text { word-break:break-all; font-size:16px; max-height:30vh; overflow:auto; margin-bottom:14px; user-select:text; }
    #result .row { display:flex; gap:8px; }
    #result .row button, #result .row a { flex:1; padding:12px; border-radius:10px; border:none; font-size:15px;
      text-align:center; text-decoration:none; background:#374151; color:var(--fg); }
    #result .row .primary { background:var(--accent); color:#052e16; font-weight:700; }
    #history { display:none; position:fixed; inset:0; z-index:20; background:var(--bg); flex-direction:column;
      padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
    #history.show { display:flex; }
    #history h2 { flex:none; font-size:18px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    #history h2 button { background:#374151; color:var(--fg); border:none; border-radius:8px; padding:10px 14px; font-size:15px; }
    #history ul { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    #result { z-index:30; }
    #err { display:none; position:fixed; left:8px; right:8px; top:calc(8px + env(safe-area-inset-top)); z-index:50;
      background:#7f1d1d; color:#fff; padding:10px 12px; border-radius:10px; font-size:13px; word-break:break-all; }
    #err.show { display:block; }
    #history ul { list-style:none; }
    #history li { position:relative; margin-bottom:8px; border-radius:10px; overflow:hidden; background:#dc2626;
      transition:height .2s, margin .2s, opacity .2s; }
    #history li .del { position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end;
      padding-right:18px; color:#fff; font-size:14px; font-weight:700; }
    #history li .item { position:relative; background:var(--card); padding:12px; word-break:break-all;
      touch-action:pan-y; user-select:none; -webkit-user-select:none; }
    #history li .item.snap { transition:transform .2s; }
    #history li.empty { background:var(--card); padding:12px; color:var(--muted); }
    #history li small { display:block; color:var(--muted); margin-top:4px; }
    #history .hint { color:var(--muted); font-size:12px; margin:-4px 0 10px; flex:none; }
    #toast { display:none; position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:40;
      background:#374151; color:var(--fg); border-radius:10px; padding:12px 14px; align-items:center; justify-content:space-between; font-size:14px; }
    #toast.show { display:flex; }
    #toast button { background:none; border:none; color:var(--accent); font-weight:700; font-size:14px; padding:4px 8px; }
  </style>
</head>
<body>
  <header>
    <span>QRリーダー</span>
  </header>

  <div id="stage">
    <video id="video" playsinline muted></video>
    <div id="frame"><div></div></div>
    <div id="msg">カメラを起動しています…</div>
  </div>

  <div id="controls">
    <button id="btnTorch" class="icon-btn" aria-label="ライト" title="ライト" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10v4l-3 4v11a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V10L7 6z"/><path d="M7 6h10"/><path d="M12 13v2"/></svg></button>
    <label for="file" class="icon-btn" role="button" aria-label="画像から読む" title="画像から読む"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></label>
    <input type="file" id="file" accept="image/*">
    <button id="btnHistory" class="icon-btn" aria-label="履歴" title="履歴"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
  </div>

  <div id="result">
    <button id="btnCloseResult" class="close-x" aria-label="閉じる" title="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <p class="label">読み取り結果</p>
    <div id="text"></div>
    <div class="row">
      <a id="btnOpen" class="primary" target="_blank" rel="noopener">開く</a>
      <button id="btnCopy">コピー</button>
      <button id="btnShare">共有</button>
    </div>
  </div>

  <div id="history">
    <h2><span>履歴</span><span><button id="btnClear">全削除</button> <button id="btnClose">閉じる</button></span></h2>
    <p class="hint">左にスワイプで削除・タップで表示</p>
    <ul id="list"></ul>
  </div>

  <div id="toast"><span>削除しました</span><button id="btnUndo">元に戻す</button></div>
  <div id="err"></div>
  <canvas id="canvas" hidden></canvas>
  <script src="jsQR.js"></script>
  <script src="app.js"></script>
</body>
</html>
