<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QRリーダー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-192-w.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-180-w.png">
  <style>
    :root { --bg:#111827; --fg:#f9fafb; --accent:#22c55e; --muted:#9ca3af; --card:#1f2937; }
    * { box-sizing:border-box; margin:0; padding:0; }
    [hidden] { display:none !important; }
    html,body { height:100%; background:var(--bg); color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
    body { position:fixed; inset:0; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    header { padding:14px 16px; font-weight:700; font-size:18px; }
    .icon-btn { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%;
      background:var(--card); color:var(--fg); border:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .icon-btn svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .icon-btn:active { transform:scale(.92); }
    .icon-btn[aria-pressed="true"] { background:#facc15; color:#111827; }
    .icon-btn.unavailable { opacity:.35; }
    #stage { position:relative; flex:1; min-height:0; overflow:hidden; background:#000; }
    /* 枠に直接はめ込み、映像サイズが分かるまでの伸び縮みを防ぐ。映像が来るまでは非表示 */
    /* <video> は映像の受け取り用。表示は上に重ねた canvas に描く */
    video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    #view { position:absolute; inset:0; width:100%; height:100%; background:#000; display:block; }
    #frame { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
    #frame div { width:min(65vw,280px); aspect-ratio:1; border:3px solid var(--accent); border-radius:16px;
      box-shadow:0 0 0 9999px rgba(0,0,0,.45); }
    #msg { position:absolute; bottom:16px; left:0; right:0; text-align:center; color:var(--muted); font-size:14px; }
    #controls { display:flex; justify-content:space-evenly; align-items:center; padding:14px 16px; }
    #controls .icon-btn { width:56px; height:56px; }
    #controls .icon-btn svg { width:26px; height:26px; }
    #file { display:none; }
    .close-x { width:36px; height:36px; border-radius:50%; border:none;
      background:#374151; color:var(--fg); display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .close-x svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; }
    #err { display:none; position:fixed; left:8px; right:8px; top:calc(8px + env(safe-area-inset-top)); z-index:50;
      background:#7f1d1d; color:#fff; padding:10px 12px; border-radius:10px; font-size:13px; word-break:break-all; }
    #err.show { display:block; }
    #toast { display:none; position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:40;
      background:#374151; color:var(--fg); border-radius:10px; padding:12px 14px; align-items:center; justify-content:space-between; font-size:14px; touch-action:manipulation; }
    #toast.show { display:flex; }
    /* 履歴画面では「履歴をすべて削除」と重ならないよう、その上に出す */
    #history.show ~ #toast { bottom:calc(80px + env(safe-area-inset-bottom)); }
    #toast button { background:none; border:none; color:var(--accent); font-weight:700; font-size:15px; padding:12px 16px; margin:-12px -14px -12px 0;
      touch-action:manipulation; -webkit-tap-highlight-color:transparent; }

    /* ---- 履歴 ---- */
    #history { display:none; position:fixed; inset:0; z-index:20; background:var(--bg); flex-direction:column;
      padding:calc(8px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom); }
    #history.show { display:flex; }
    #history .h-head { flex:none; display:flex; align-items:center; justify-content:space-between; padding:8px 16px 4px 20px; }
    #history .h-title { font-size:28px; font-weight:800; letter-spacing:.02em; }
    #history .h-count { font-size:13px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums; }
    #history .h-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 16px 16px; }
    #history section + section { margin-top:22px; }
    #history h3 { font-size:13px; font-weight:600; color:var(--muted); margin:14px 4px 8px; }
    #history ul { list-style:none; background:var(--card); border-radius:14px; overflow:hidden; }
    #history li { position:relative; background:#dc2626; transition:height .2s, opacity .2s; }
    #history li .del { position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end; gap:6px;
      padding-right:20px; color:#fff; font-size:14px; font-weight:700; }
    #history li .del svg, .kind svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2;
      stroke-linecap:round; stroke-linejoin:round; }
    #history .item { position:relative; display:flex; align-items:center; gap:12px; min-height:60px; padding:10px 14px;
      background:var(--card); touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:pointer; }
    #history .item.snap { transition:transform .2s; }
    #history .item:active { background:#273244; }
    /* 行の区切り線はアイコンの右から */
    #history li + li .item::before { content:""; position:absolute; top:0; left:58px; right:0; height:1px; background:#2d3748; }
    .kind { flex:none; width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center;
      background:rgba(34,197,94,.14); color:var(--accent); }
    .kind.text { background:rgba(148,163,184,.14); color:#cbd5e1; }
    #history .main { flex:1; min-width:0; }
    #history .ttl { font-size:16px; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #history .kind.text + .main .ttl { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-all; }
    #history .sub { font-size:13px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #history time { flex:none; align-self:flex-start; margin-top:3px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
    #history .hint { text-align:center; color:#6b7280; font-size:12px; margin-top:16px; }
    #history .empty { display:flex; flex-direction:column; align-items:center; text-align:center; padding:72px 24px; color:var(--muted); }
    #history .empty svg { width:48px; height:48px; fill:none; stroke:#4b5563; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; margin-bottom:16px; }
    #history .empty strong { color:var(--fg); font-size:16px; margin-bottom:6px; }
    #history .empty p { font-size:14px; line-height:1.6; }
    #history .h-foot { flex:none; padding:8px 16px 12px; border-top:1px solid #1f2937; }
    #history .clear-all { width:100%; padding:13px; border:none; border-radius:12px; background:none; color:#f87171; font-size:15px; font-weight:600; }
    #history .clear-all:active { background:#1f2937; }
    #history .clear-all:disabled { color:#4b5563; }

    /* ---- 読み取り結果 ---- */
    #scrim { position:fixed; inset:0; z-index:29; background:rgba(3,7,18,.55); opacity:0; visibility:hidden; transition:opacity .2s, visibility .2s; }
    #scrim.show { opacity:1; visibility:visible; }
    #result { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--card); border-radius:20px 20px 0 0;
      padding:16px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow:0 -12px 32px rgba(0,0,0,.35);
      transform:translateY(105%); visibility:hidden; transition:transform .25s cubic-bezier(.2,.8,.2,1), visibility .25s; }
    #result.show { transform:none; visibility:visible; }
    #result .r-head { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    #result .r-type { flex:1; font-size:14px; color:var(--muted); }
    #result .r-host { font-size:22px; font-weight:800; line-height:1.3; word-break:break-all; margin-bottom:4px; }
    #text { font-size:14px; color:var(--muted); line-height:1.5; word-break:break-all; max-height:4.5em; overflow:auto; user-select:text; -webkit-user-select:text; }
    #result.is-text #text { font-size:17px; color:var(--fg); max-height:40vh; white-space:pre-wrap; }
    #result.is-text #btnShare { grid-column:1 / -1; }
    #result .r-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }
    #result .btn { display:flex; align-items:center; justify-content:center; gap:8px; min-height:50px; padding:0 14px; border:none;
      border-radius:14px; background:#374151; color:var(--fg); font-size:16px; font-weight:600; text-decoration:none; cursor:pointer; }
    #result .btn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    #result .btn.primary { grid-column:1 / -1; background:var(--accent); color:#052e16; font-weight:800; }
    #result .btn:active { filter:brightness(.92); }
    #result .btn.done { color:var(--accent); }
    @media (prefers-reduced-motion: reduce) { #result, #scrim { transition:none; } }
  </style>
</head>
<body>
  <header>
    <span>QRリーダー</span>
  </header>

  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="view"></canvas>
    <div id="frame"><div></div></div>
    <div id="msg">カメラを起動しています…</div>
  </div>

  <div id="controls">
    <button id="btnTorch" class="icon-btn" aria-label="ライト" title="ライト" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10v4l-3 4v11a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V10L7 6z"/><path d="M7 6h10"/><path d="M12 13v2"/></svg></button>
    <label for="file" class="icon-btn" role="button" aria-label="画像から読む" title="画像から読む"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></label>
    <input type="file" id="file" accept="image/*">
    <button id="btnHistory" class="icon-btn" aria-label="履歴" title="履歴"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
  </div>

  <div id="scrim"></div>
  <div id="result" role="dialog" aria-labelledby="rType">
    <div class="r-head">
      <div class="kind" id="rKind"></div>
      <div class="r-type" id="rType"></div>
      <button id="btnCloseResult" class="close-x" aria-label="閉じる" title="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="r-host" id="rHost"></div>
    <div id="text"></div>
    <div class="r-actions">
      <a id="btnOpen" class="btn primary" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>開く</span></a>
      <button id="btnCopy" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span>コピー</span></button>
      <button id="btnShare" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg><span>共有</span></button>
    </div>
  </div>

  <div id="history" role="dialog" aria-labelledby="hTitle">
    <div class="h-head">
      <div><div class="h-title" id="hTitle">履歴</div><div class="h-count" id="hCount"></div></div>
      <button id="btnClose" class="close-x" aria-label="閉じる" title="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="h-scroll"><div id="list"></div></div>
    <div class="h-foot"><button id="btnClear" class="clear-all">履歴をすべて削除</button></div>
  </div>

  <div id="toast"><span>削除しました</span><button id="btnUndo">元に戻す</button></div>
  <div id="err"></div>
  <canvas id="canvas" hidden></canvas>
  <script src="jsQR.js"></script>
  <script src="app.js"></script>
</body>
</html>
